<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#cfe6ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wander">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Wander</title>
<style>/*LEAFLET_CSS*/</style>
<style>/*FONTS*/</style>
<style>
:root{
  --ground:#cfe6ff; --ground2:#c3defc; --pink:#ffc2d9; --pink2:#ff9dc0; --blue:#a9d4ff; --blue2:#7fbcf5;
  --white:#fff; --ink:#1b1630; --muted:#4f5b7a; --rec:#ff7aa8;
  --px:"Tiny5",ui-monospace,Menlo,monospace;
  --body:"Pixelify Sans",ui-monospace,Menlo,monospace;
  --tabh:calc(68px + env(safe-area-inset-bottom));
  --o:-3px 0 0 0 var(--ink),3px 0 0 0 var(--ink),0 -3px 0 0 var(--ink),0 3px 0 0 var(--ink);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background-color:var(--ground);
  background-image:conic-gradient(var(--ground2) 25%,transparent 0 50%,var(--ground2) 0 75%,transparent 0);
  background-size:16px 16px;
  color:var(--ink);font:18px/1.35 var(--body);overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;
  -webkit-font-smoothing:none;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
::selection{background:var(--pink);color:var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
input{caret-color:var(--pink2)}
h1,h2,h3{font-family:var(--px);font-weight:400;margin:0;line-height:1.5;letter-spacing:0}
#app{position:fixed;inset:0;overflow:hidden}
.view{position:absolute;left:0;right:0;top:0;bottom:var(--tabh);display:none;overflow:hidden}
.view.on{display:block}
#offline{display:none;position:absolute;top:0;left:0;right:0;z-index:2500;background:var(--ink);color:var(--white);text-align:center;font-size:14px;padding:4px 8px;padding-top:calc(4px + env(safe-area-inset-top))}
#offline.on{display:block}

/* shared pixel pieces */
svg.i{display:block;flex:none;color:inherit;image-rendering:pixelated}
.box{background:var(--white);box-shadow:var(--o),0 6px 0 0 var(--ink)}
.btn{
  border:0;background:var(--pink);color:var(--ink);font:400 13px/1.3 var(--px);text-align:center;text-decoration:none;
  display:flex;gap:10px;align-items:center;justify-content:center;min-height:52px;padding:14px 12px;
  box-shadow:var(--o),0 6px 0 0 var(--ink),inset 0 -3px 0 0 var(--pink2),inset 0 3px 0 0 rgba(255,255,255,.65);
  margin-bottom:8px;
}
.btn:active:not([disabled]){transform:translateY(3px);box-shadow:var(--o),inset 0 3px 0 0 var(--pink2)}
.btn.blue{background:var(--blue);box-shadow:var(--o),0 6px 0 0 var(--ink),inset 0 -3px 0 0 var(--blue2),inset 0 3px 0 0 rgba(255,255,255,.65)}
.btn.blue:active:not([disabled]){box-shadow:var(--o),inset 0 3px 0 0 var(--blue2)}
.btn.ghost{background:var(--white);box-shadow:var(--o),0 6px 0 0 var(--ink),inset 0 -3px 0 0 #d9e6f8}
.btn.ghost:active:not([disabled]){box-shadow:var(--o),inset 0 3px 0 0 #d9e6f8}
.btn.small{min-height:44px;font-size:11px;padding:10px 10px}
.btn[disabled]{opacity:.55}
.row{display:flex;gap:16px;margin-top:14px}
.row>*{flex:1;min-width:0}
.row.center{justify-content:center}
.row.center>*{flex:0 0 50%}
.row.center.wide>*{flex:0 0 72%}
.wrow{display:flex;align-items:center;gap:8px;margin:10px 0 0;flex-wrap:wrap}.wrow .wtxt{flex:1 1 100%;display:flex;flex-direction:column}.wrow .wtxt span{font-size:.8em;opacity:.7}.wrow .btn{flex:0 0 auto}
.row.center>.chip{justify-content:center;margin-bottom:0}

/* maps */
.mapbox{position:absolute;z-index:0;background:var(--blue)}
.paper-tiles{filter:saturate(.3) contrast(.9) brightness(1.08);filter:url(#pastel)}
.leaflet-container{background:var(--blue);font-family:var(--body)}
.leaflet-control-attribution{font:12px var(--body)!important;background:rgba(255,255,255,.85)!important;color:var(--ink)}
#map .leaflet-top .leaflet-control,#bmap .leaflet-top .leaflet-control{margin-top:calc(76px + env(safe-area-inset-top));margin-left:16px}
.pin{width:34px;height:34px;background:var(--pink);box-shadow:var(--o);display:flex;align-items:center;justify-content:center;font:400 12px var(--px);color:var(--ink);position:relative}
.pin::after{content:"";position:absolute;left:12px;bottom:-12px;width:10px;height:8px;background:var(--ink)}
.pin.blue{background:var(--blue)}
.pin.photo{background:var(--white);padding:0;overflow:visible}
.pin.photo img{width:34px;height:34px;object-fit:cover;display:block}
.pin.voice{background:var(--blue)}

/* today */
#map{inset:0}
#hud{position:absolute;z-index:600;top:calc(14px + env(safe-area-inset-top));left:16px;right:76px;display:flex;justify-content:space-between;gap:8px;padding:12px;font:400 11px/1 var(--px);margin-right:4px}
#hud b{font-weight:400}
.recenter{position:absolute;right:16px;top:calc(14px + env(safe-area-inset-top));z-index:600;width:48px;height:48px;padding:0;min-height:0;margin:0}
#panel{position:absolute;z-index:500;left:16px;right:16px;bottom:40px;padding:18px 16px 12px;text-align:center}
#panel h1{font-size:15px;margin:0 0 6px;text-transform:uppercase}
#panel .sub{margin:0 0 14px;color:var(--muted);font-size:18px}
.go{
  width:164px;height:164px;border:0;background:var(--pink);color:var(--ink);font:400 38px/1 var(--px);text-shadow:3px 3px 0 var(--white);
  margin:6px auto 22px;display:block;
  box-shadow:var(--o),0 6px 0 0 var(--ink),inset 0 -5px 0 0 var(--pink2),inset 0 5px 0 0 rgba(255,255,255,.65);
}
.go:active:not([disabled]){transform:translateY(8px);box-shadow:var(--o),inset 0 5px 0 0 var(--pink2)}
.go[disabled]{font-size:13px;line-height:1.5;padding:0 14px;text-shadow:none}
.start{font:400 10px var(--px);display:inline-block;animation:blink 1s steps(2) infinite;margin:0 0 12px}
@keyframes blink{50%{opacity:0}}
.chip{border:0;background:var(--blue);padding:9px 12px;font:400 14px var(--body);color:var(--ink);display:inline-flex;gap:8px;align-items:center;max-width:100%;box-shadow:var(--o);margin-bottom:6px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font:400 26px/1.2 var(--px);margin:4px 0 4px}
.big small{display:block;font:400 18px/1.3 var(--body);color:var(--muted);margin-top:6px}
.wlen{display:flex;justify-content:center;align-items:center;gap:10px;margin:0 0 6px}
.step{width:50px;height:50px;border:0;background:var(--blue);box-shadow:var(--o);font:400 26px/1 var(--px);color:var(--ink);padding:0}
.step:active{background:var(--pink)}
.wmin{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--white);box-shadow:var(--o);height:50px;min-width:140px;padding:0 12px}
.wmin input{width:3ch;border:0;background:transparent;font:400 26px var(--px);color:var(--ink);text-align:center;padding:0;border-radius:0;-moz-appearance:textfield;appearance:textfield}
.wmin input::-webkit-outer-spin-button,.wmin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wmin span{font:400 13px var(--px)}
.chip.tiny{font-size:13px;padding:5px 10px;background:var(--white);margin:2px 0 0}
.destin{width:100%;font:400 18px var(--body);padding:10px 12px;border:0;background:var(--white);box-shadow:var(--o);color:var(--ink);margin:2px 0 10px;border-radius:0;-webkit-appearance:none}
.sugs{display:flex;flex-direction:column;gap:8px;max-height:min(40vh,300px);overflow:auto;margin:0 0 8px;padding:3px}
.sug{border:0;background:var(--white);box-shadow:var(--o);padding:8px 10px;text-align:left;font:400 17px/1.15 var(--body);color:var(--ink);display:block;width:100%}
.sug small{display:block;color:var(--muted);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug:active{background:var(--pink)}
.sug.rec b::before{content:'\2605 ';color:var(--pink2)}
.dest{font-size:18px;margin:0 0 6px}
.note{font-size:16px;color:var(--muted);margin:2px 0 8px}
.note.warn{color:var(--ink);background:var(--pink);padding:6px 8px;box-shadow:var(--o)}
.capture{display:flex;justify-content:center;gap:28px;margin:12px 0 10px}
.round{display:flex;flex-direction:column;align-items:center;gap:12px;border:0;background:none;font:400 15px var(--body);color:var(--ink);padding:0}
.round b{width:76px;height:76px;background:var(--ink);color:var(--white);display:flex;align-items:center;justify-content:center;box-shadow:var(--o),0 6px 0 0 var(--ink),inset 0 3px 0 0 rgba(255,255,255,.25)}
.round.mic b{background:var(--blue);color:var(--ink);box-shadow:var(--o),0 6px 0 0 var(--ink),inset 0 -3px 0 0 var(--blue2),inset 0 3px 0 0 rgba(255,255,255,.65)}
.round:active b{transform:translateY(3px)}
#recbar{display:none;align-items:center;gap:12px;background:var(--pink);box-shadow:var(--o);padding:10px 12px;margin:0 4px 16px;text-align:left}
#recbar.on{display:flex}
#recbar .dot{width:14px;height:14px;background:var(--ink);animation:blink 1s steps(2) infinite}
#recbar .t{font:400 16px var(--px);flex:1}
#recbar button{border:0;background:var(--white);box-shadow:var(--o);padding:10px 14px;font:400 11px var(--px)}

/* journal */
#jlist{position:absolute;inset:0;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 20px 44px;-webkit-overflow-scrolling:touch}
#jlist h2,#profile h2{font-size:17px;margin:4px 4px 22px;text-transform:uppercase}
.empty{text-align:center;padding:24px 16px;margin:0 4px}
.empty h3{font-size:13px;margin-bottom:10px}
.empty p{margin:0;color:var(--muted)}
.day{padding:14px 14px 10px;margin:0 4px 24px}
.day.sel{background:var(--pink)}
.dayhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;width:100%;border:0;background:none;text-align:left;padding:0 0 10px}
.dayhead h3{font-size:12px}
.dayhead span{display:block;font-size:16px;color:var(--muted);margin-top:6px}
.day.sel .dayhead span{color:var(--ink)}
.items{display:flex;flex-wrap:wrap;gap:16px}
.item{display:flex;flex-direction:column;gap:6px;width:100px}
.thumb{width:100px;height:100px;border:0;padding:0;background:var(--blue);box-shadow:var(--o)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.vchip{display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--blue);color:var(--ink);padding:0 10px;height:44px;font:400 12px var(--px);box-shadow:var(--o)}
.item.pair .vchip{margin-top:6px}
.cap{font-size:15px;color:var(--muted);line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* map tab */
#mapbar{position:absolute;z-index:600;top:calc(14px + env(safe-area-inset-top));left:16px;right:76px;padding:10px 10px 4px}
#mapbar .seg{margin:0 0 8px}
#mapbar .seg button{padding:10px 4px}
#mapbar .opts{display:flex;gap:8px;margin:0 0 8px}
#mapbar .opts[hidden]{display:none}
#mapbar select,#mapbar input[type=date]{flex:1;min-width:0;border:0;background:var(--ground);box-shadow:var(--o);padding:8px;font:400 16px var(--body);border-radius:0;color:var(--ink);margin:4px}
#mapbar .count{font-size:14px;color:var(--muted);margin:0 0 6px}

/* profile */
#profile{position:absolute;inset:0;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 20px 44px;-webkit-overflow-scrolling:touch}
.card{padding:16px;margin:0 4px 28px}
.card h3{font-size:12px;margin-bottom:8px}
.card p{margin:2px 0 12px;color:var(--muted);font-size:17px}
.seg{display:flex;gap:12px;margin:8px 0 14px}
.seg button{flex:1;border:0;background:var(--white);padding:12px 6px;font:400 10px/1.4 var(--px);box-shadow:var(--o)}
.seg button.on{background:var(--pink)}
.field{display:flex;gap:14px;margin-bottom:10px}
.field input[type=text]{flex:1;min-width:0;border:0;background:var(--white);box-shadow:var(--o);padding:12px;font-size:18px;border-radius:0}
.field .btn{flex:none;width:76px;margin:0}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 4px 4px}
.stepper b{font:400 18px var(--px)}
.stepper button{width:52px;height:52px;border:0;background:var(--blue);box-shadow:var(--o),0 6px 0 0 var(--ink),inset 0 -3px 0 0 var(--blue2),inset 0 3px 0 0 rgba(255,255,255,.65);font:400 22px var(--px);color:var(--ink);margin-bottom:8px}
.stepper button:active{transform:translateY(3px)}
.prog{font-size:16px;color:var(--muted);margin-top:10px;min-height:22px}
.bar{height:16px;background:var(--white);box-shadow:var(--o);margin:12px 4px 4px;display:none}
.bar.on{display:block}
.bar i{display:block;height:100%;background:var(--pink);width:0}

/* character sprite on the map (4-frame walk cycle, mirrored by heading) */
.walker{position:relative}
.walker .wbody{position:relative;width:39px;height:63px}
.walker.flip .wbody{transform:scaleX(-1)}
.walker .wf{position:absolute;left:0;top:0;visibility:hidden}
.walker:not(.walk) .wf.s{visibility:visible}
.walker.walk .wf.f0{animation:wf .6s step-end infinite}
.walker.walk .wf.f1{animation:wf .6s step-end .15s infinite}
.walker.walk .wf.f2{animation:wf .6s step-end .3s infinite}
.walker.walk .wf.f3{animation:wf .6s step-end .45s infinite}
@keyframes wf{0%{visibility:visible}25%{visibility:hidden}100%{visibility:hidden}}
/* progress strip while walking */
.pstrip{margin:4px 4px 8px}
.ptrack{position:relative;height:16px;background:var(--white);box-shadow:var(--o);margin:42px 14px 4px}
.ptrack i{display:block;height:100%;background:var(--pink);width:0}
#pwalk{position:absolute;left:0;bottom:9px;transform:translateX(-50%);line-height:0}
#pwalk.back svg{transform:scaleX(-1)}
/* character creator */
#cstage{position:relative;height:236px;margin:8px 4px 18px;box-shadow:var(--o);background:var(--blue);overflow:hidden}
#cstage::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34px;background:var(--pink);border-top:3px solid var(--ink)}
#cprev{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:1;line-height:0}
.seg.parts{gap:6px;flex-wrap:wrap}
.seg.parts button{padding:12px 2px;font-size:9px;flex:1 0 21%}
.seg.wrap{flex-wrap:wrap;gap:8px}
.seg.wrap button{flex:1 0 21%;padding:12px 2px}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:4px 4px 16px}
.pre{border:0;background:var(--white);box-shadow:var(--o);padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font:400 8px/1.2 var(--px);color:var(--ink);min-width:0}
.pre:active{background:var(--pink)}
.pre span{max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:clip}
.swatches{display:flex;flex-wrap:wrap;gap:12px;margin:6px 4px 18px}
.sw{width:34px;height:34px;border:0;padding:0;box-shadow:var(--o)}
.sw.on{box-shadow:var(--o),inset 0 0 0 4px var(--white),inset 0 0 0 8px var(--ink)}
.wheelrow{display:flex;gap:16px;align-items:flex-start;margin:0 4px}
#wheel{width:192px;height:192px;flex:none;image-rendering:pixelated;touch-action:none;cursor:crosshair}
.hexcol{flex:1;min-width:0}
.hexcol .sw.cur{display:block;width:100%;height:56px;margin:16px 0 0}
/* entries + entry form */
.jhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:4px 4px 22px}
#jlist .jhead h2{margin:0}
.jhead .btn{flex:none;width:auto;min-width:100px;margin:0}
.day>.items{margin-bottom:16px}
.entry{background:var(--ground);box-shadow:var(--o);padding:10px 12px 12px;margin:0 4px 18px}
.ehead{display:block;width:100%;border:0;background:none;text-align:left;padding:0 0 6px}
.etime{display:flex;align-items:center;gap:8px;font:400 10px var(--px);margin-bottom:8px}
.etext{display:block;font-size:18px;white-space:pre-wrap;word-break:break-word}
.entry .items{margin-top:6px}
#eform{position:fixed;inset:0;z-index:3000;background:var(--ground);display:none;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#eform.on{display:block}
#eform h2{font-size:17px;margin:4px 4px 22px;text-transform:uppercase}
.fin{display:block;width:100%;min-width:0;min-height:48px;border:0;background:var(--white);box-shadow:var(--o);padding:12px;font:18px/1.3 var(--body);border-radius:0;-webkit-appearance:none;appearance:none;color:var(--ink)}
textarea.fin{resize:none;min-height:110px}
.fitem{position:relative;width:100px}
.fitem .vchip{justify-content:flex-start;padding-right:26px}
.fitem .x{position:absolute;top:-10px;right:-10px;width:32px;height:32px;border:0;background:var(--pink);box-shadow:var(--o);font:400 12px var(--px);padding:0;z-index:2}
#pick{position:relative;z-index:0;height:230px;margin:10px 4px 14px;box-shadow:var(--o);background:var(--blue)}
#pick[hidden]{display:none}
#t-mic{position:absolute;z-index:2001;left:calc(50% + 46px);bottom:calc(var(--tabh) - 10px);width:40px;height:40px;padding:0;border:0;background:var(--blue);display:flex;align-items:center;justify-content:center;
  box-shadow:var(--o),0 3px 0 0 var(--ink),inset 0 -3px 0 0 var(--blue2),inset 0 3px 0 0 rgba(255,255,255,.65)}
#t-mic:active{transform:translateY(2px)}
#t-mic.rec{background:var(--pink);animation:blink 1s steps(2) infinite}

/* tabs */
#tabs{position:absolute;left:0;right:0;bottom:0;height:var(--tabh);z-index:2000;display:flex;background:var(--white);border-top:3px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;border:0;background:none;color:var(--ink);font:400 10px var(--px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-transform:uppercase}
#tabs button.on{background:var(--pink)}
#tabs button+button{border-left:3px solid var(--ink)}
#tabs button.cam{flex:none;width:92px;background:none;border:0;position:relative;padding:0}
#tabs button.cam+button{border-left:0}
#tabs button.cam b{position:absolute;left:50%;top:-26px;width:68px;height:68px;margin-left:-34px;background:var(--pink);display:flex;align-items:center;justify-content:center;
  box-shadow:var(--o),0 6px 0 0 var(--ink),inset 0 -5px 0 0 var(--pink2),inset 0 5px 0 0 rgba(255,255,255,.65)}
#tabs button.cam:active b{transform:translateY(3px);box-shadow:var(--o),inset 0 -5px 0 0 var(--pink2)}

/* viewer + toast */
#viewer{position:fixed;inset:0;z-index:3000;background:rgba(27,22,48,.94);display:none;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#viewer.on{display:flex}
#vbody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px}
#vbody img{max-width:100%;max-height:100%;box-shadow:var(--o);background:var(--white);border:0}
#vbody .audio{width:100%;max-width:420px;text-align:center;color:var(--white);display:flex;flex-direction:column;align-items:center;gap:18px}
#vbody audio{width:100%}
#vinfo{padding:16px 20px 24px;background:var(--white);border-top:3px solid var(--ink)}
#vinfo .meta{font-size:16px;color:var(--muted);margin-bottom:10px}
#vinfo input{width:100%;border:0;background:var(--ground);box-shadow:var(--o);padding:12px;font-size:18px;border-radius:0;margin:0 0 6px}
#vinfo .row .btn{margin-bottom:8px}
#toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-16px);background:var(--white);color:var(--ink);padding:12px 16px;font:400 17px/1.25 var(--body);box-shadow:var(--o),0 6px 0 0 var(--ink);opacity:0;pointer-events:none;z-index:4000;width:max-content;max-width:calc(100vw - 48px);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="pastel" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".311 1.046 .1056 0 -.463  .1665 .56 .0565 0 .217  .0276 .093 .0094 0 .87  0 0 0 1 0"/></filter></svg>
<div id="app">
  <div id="offline">OFFLINE: your journal works, and Go uses saved spots.</div>

  <section class="view on" id="v-today">
    <div class="mapbox" id="map"></div>
    <div id="hud" class="box"><b id="hudL">WALKS 00</b><b id="hudR">0.0 KM</b></div>
    <button class="btn ghost recenter" id="recenter" aria-label="Centre map on me"></button>

<script>/*LEAFLET_JS*/</script>
<script>
(() => {
'use strict';

/* ---------- tiny helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const dateStr = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const toLocalInput = ts => { const d = new Date(ts); return dateStr(ts) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtDist = m => m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m / 10) * 10 + ' m';
const fmtDur = s => Math.floor(s / 60) + ':' + pad(Math.round(s % 60) % 60);
let toastT;
function toast(msg, ms = 2800) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), ms);
}
// Any hidden failure becomes visible, so a broken screen is never silent.
window.addEventListener('error', e => toast('Error: ' + (e.message || 'something broke'), 6000));
window.addEventListener('unhandledrejection', e => toast('Error: ' + ((e.reason && e.reason.message) || e.reason || 'something broke'), 6000));

/* ---------- pixel art: ASCII bitmaps drawn as crisp SVG ---------- */
const COL = { '#': 'currentColor', k: '#1b1630', p: '#ffc2d9', w: '#ffffff', b: '#a9d4ff' };
function px(rows, scale = 2) {
  const h = rows.length, w = rows[0].length, by = {};
  rows.forEach((r, y) => {
    for (let x = 0; x < w;) {
      const c = r[x]; if (c === '.') { x++; continue; }
      let n = 1; while (x + n < w && r[x + n] === c) n++;
      (by[c] = by[c] || []).push(`M${x} ${y}h${n}v1h-${n}z`); x += n;
    }
  });
  const paths = Object.keys(by).map(c => `<path d="${by[c].join('')}" fill="${COL[c]}"/>`).join('');
  return `<svg class="i" width="${w * scale}" height="${h * scale}" viewBox="0 0 ${w} ${h}" shape-rendering="crispEdges">${paths}</svg>`;
}
const BM = {
  cam: ['...####.....', '############', '############', '####....####', '###.####.###', '###.####.###', '####....####', '############', '############'],
  mic: ['...###...', '..#####..', '..#####..', '..#####..', '#.#####.#', '#.#####.#', '.#.###.#.', '..#####..', '....#....', '..#####..'],
  pin: ['..#####..', '.#######.', '###...###', '###...###', '###...###', '.#######.', '.#######.', '..#####..', '..#####..', '...###...', '...###...', '....#....'],
  book: ['.#####..#####.', '#.....##.....#', '#.###.##.###.#', '#.....##.....#', '#.###.##.###.#', '#.....##.....#', '#.###.##.###.#', '.#####..#####.'],
  sliders: ['......###..', '###########', '......###..', '...........', '..###......', '###########', '..###......', '...........', '.......###.', '###########', '.......###.'],
  die: ['#########', '#.......#', '#.....#.#', '#.......#', '#...#...#', '#.......#', '#.#.....#', '#.......#', '#########'],
  play: ['#......', '###....', '#####..', '#######', '#####..', '###....', '#......'],
  cross: ['....#....', '....#....', '....#....', '....#....', '####.####', '....#....', '....#....', '....#....', '....#....'],
  heart: ['.kkk.kkk.', 'kpwpkpppk', 'kpppppppk', 'kpppppppk', '.kpppppk.', '..kpppk..', '...kpk...', '....k....'],
  map: ['.....####.....', '####.####.####', '####.####.####', '####.####.####', '####.####.####', '####.####.####', '####.####.####', '####.####.####', '####.####.####', '####.....####'],
  person: ['..####..', '.######.', '.######.', '..####..', '........', '.######.', '########', '########', '########'],
  flag: ['kkkkkkk..', 'kppppppk.', 'kpwppppk.', 'kppppppk.', 'kkkkkkk..', 'k........', 'k........', 'k........', 'k........', 'k........', 'kk.......', 'kkk......']
};
const ICON = {
  cam: px(BM.cam, 3), mic: px(BM.mic, 3), pin: px(BM.pin), pinS: px(BM.pin, 1.5), book: px(BM.book), sliders: px(BM.sliders),
  map: px(BM.map), person: px(BM.person), die: px(BM.die), play: px(BM.play, 2), cross: px(BM.cross), micS: px(BM.mic, 1.5), bookB: px(BM.book, 2)
};

/* ---------- storage (IndexedDB) ---------- */
let db;
function openDB() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('wander', 2);
    r.onupgradeneeded = e => {
      const d = r.result;
      if (e.oldVersion < 1) {
        d.createObjectStore('walks', { keyPath: 'id' });
        d.createObjectStore('media', { keyPath: 'id' }).createIndex('date', 'date');
        d.createObjectStore('bank', { keyPath: 'id', autoIncrement: true });
        d.createObjectStore('kv');
      }
      if (e.oldVersion < 2) d.createObjectStore('entries', { keyPath: 'id' }).createIndex('date', 'date');   // manual journal entries, not tied to a walk
    };
    r.onblocked = () => toast('Close other Wander tabs so it can finish updating.', 6000);
    r.onsuccess = () => { db = r.result; db.onversionchange = () => db.close(); res(); };
    r.onerror = () => rej(r.error);
  });
}
const tx = (store, mode, fn) => new Promise((res, rej) => {
  const t = db.transaction(store, mode); const q = fn(t.objectStore(store));
  t.oncomplete = () => res(q && q.result); t.onerror = t.onabort = () => rej(t.error);
});
const dbGet = (s, k) => tx(s, 'readonly', o => o.get(k));
const dbAll = s => tx(s, 'readonly', o => o.getAll());
const dbPut = (s, v, k) => tx(s, 'readwrite', o => k === undefined ? o.put(v) : o.put(v, k));
const dbDel = (s, k) => tx(s, 'readwrite', o => o.delete(k));

/* ---------- settings ---------- */
const defaults = { pace: 5.5, startMode: 'gps', address: null, name: '', character: null, recent: [], walkMin: 30 };
let settings = { ...defaults };
const saveSettings = () => dbPut('kv', settings, 'settings');

/* ---------- geo maths ---------- */
const R = 6371000, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function hav(a, b) {
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const x = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
function project(p, brg, d) {
  const b = rad(brg), dr = d / R, la = rad(p.lat), lo = rad(p.lng);
  const la2 = Math.asin(Math.sin(la) * Math.cos(dr) + Math.cos(la) * Math.sin(dr) * Math.cos(b));
  const lo2 = lo + Math.atan2(Math.sin(b) * Math.sin(dr) * Math.cos(la), Math.cos(dr) - Math.sin(la) * Math.sin(la2));
  return { lat: deg(la2), lng: deg(lo2) };
}

/* ---------- location ---------- */
let pos = null, watchId = null;
function startWatch() {
  if (!navigator.geolocation || watchId != null) return;
  watchId = navigator.geolocation.watchPosition(p => {
    pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, ts: Date.now() };
    onPos();
  }, () => {}, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
}
function getPosOnce() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('This device has no location support.'));
    navigator.geolocation.getCurrentPosition(
      p => { pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, ts: Date.now() }; res(pos); },
      e => rej(new Error(e.code === 1 ? 'Location is turned off for Wander. Allow it in your phone settings, or set a start address in Settings.' : 'Couldn’t get a location fix. Try again outside, or set a start address in Settings.')),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  });
}
async function getStart() {
  if (settings.startMode === 'address' && settings.address) return { lat: settings.address.lat, lng: settings.address.lng };
  if (pos && Date.now() - pos.ts < 120000) return { lat: pos.lat, lng: pos.lng };
  const p = await getPosOnce(); return { lat: p.lat, lng: p.lng };
}

/* ---------- routing / Go ---------- */
// Walk time is the whole out-and-back trip, in minutes (she sets it on the GO! screen); each way is half.
const WALK_MIN = { lo: 10, hi: 120, step: 5 };
const totalMin = () => clamp(Math.round(+settings.walkMin || 30), WALK_MIN.lo, WALK_MIN.hi);
const eachMin = () => totalMin() / 2;
const fmtMin = x => Number.isInteger(x) ? String(x) : x.toFixed(1);
const walkedOf = w => w.walkedM != null ? w.walkedM : w.distM * 2;
const metersPerMin = () => settings.pace * 1000 / 60;

async function route(a, b) {
  const url = `https://routing.openstreetmap.de/routed-foot/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
  const ac = new AbortController(); const to = setTimeout(() => ac.abort(), 9000);
  try {
    const r = await fetch(url, { signal: ac.signal });
    const j = await r.json();
    if (j.code !== 'Ok' || !j.routes || !j.routes[0]) throw new Error('no route');
    const rt = j.routes[0];
    return {
      dist: rt.distance,
      coords: rt.geometry.coordinates.map(([x, y]) => [y, x]),
      snapped: { lat: j.waypoints[1].location[1], lng: j.waypoints[1].location[0] }
    };
  } finally { clearTimeout(to); }
}
// Pick a random heading and adjust until the real walking route is about the chosen time each way.
async function genLive(start, { bearing = null, tries = 3, onTry = () => {} } = {}) {
  const targetM = metersPerMin() * eachMin(), tolM = metersPerMin() * eachMin() / 6;
  let best = null;
  for (let b = 0; b < tries; b++) {
    const brg = bearing == null ? Math.random() * 360 : (bearing + (b === 0 ? 0 : (b % 2 ? 1 : -1) * 35 * Math.ceil(b / 2)) + 360) % 360;
    let straight = targetM / 1.35;
    for (let i = 0; i < 4; i++) {
      onTry();
      const r = await route(start, project(start, brg, straight));
      const err = Math.abs(r.dist - targetM);
      if (!best || err < best.err) best = { ...r, err };
      if (err <= tolM) return finalize(start, best);
      straight *= clamp(targetM / Math.max(r.dist, 60), 0.4, 2.5);
      await sleep(250);
    }
  }
  if (best && best.err <= metersPerMin() * eachMin() / 3) return finalize(start, best);
  throw new Error('no good route found');
}
function finalize(start, r) {
  return { start, dest: r.snapped, route: r.coords, distM: r.dist, durMin: r.dist / metersPerMin(), approx: false };
}
function straightLine(start) {
  const targetM = metersPerMin() * eachMin();
  const d = project(start, Math.random() * 360, targetM / 1.3);
  return { start, dest: d, route: [[start.lat, start.lng], [d.lat, d.lng]], distM: targetM, durMin: eachMin(), approx: true };
}
async function fromBank(start) {
  const all = await dbAll('bank');
  const ok = all.filter(b => hav(b.start, start) < 600 && Math.abs((b.pace || settings.pace) - settings.pace) <= 1 && (b.walkMin || 30) === totalMin());
  if (!ok.length) return null;
  const b = ok[Math.floor(Math.random() * ok.length)];
  await dbDel('bank', b.id);
  return { start, dest: b.dest, route: b.route, distM: b.distM, durMin: b.distM / metersPerMin(), approx: false, fromBank: true };
}

/* ---------- state ---------- */
let today = null;            // today's walk record
let busy = false;
let recState = null;         // active voice recording
let camPosP = null;         // GPS fix being fetched while the camera is open

const pickCurrent = ws => ws.filter(w => w.date === todayStr() && w.status !== 'done').sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))[0] || null;
async function loadToday() { today = pickCurrent(await dbAll('walks')); }
let todayLine = '';
async function paintHud() {
  const walks = await dbAll('walks');
  const done = walks.filter(w => w.status === 'done');
  const km = done.reduce((s, w) => s + walkedOf(w), 0) / 1000;
  const td = done.filter(w => w.date === todayStr());
  todayLine = td.length ? `Today: ${td.length} walk${td.length === 1 ? '' : 's'}, ${fmtDist(td.reduce((s, w) => s + walkedOf(w), 0))}` : '';
  const tl = $('#todayLine'); if (tl) tl.textContent = todayLine;
  $('#hudL').textContent = 'WALKS ' + pad(done.length);
  $('#hudR').textContent = km.toFixed(1) + ' KM';
}

/* ---------- maps ---------- */
function mkMap(id) {
  const m = L.map(id, { zoomControl: false, attributionControl: false, tap: true }).setView([43.6532, -79.3832], 15);
  L.control.attribution({ position: 'topleft', prefix: false }).addTo(m);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18, maxNativeZoom: 17, minZoom: 10, className: 'paper-tiles', crossOrigin: true,
    attribution: '© OpenStreetMap'
  }).addTo(m);
  return m;
}
const mkPin = (cls, label) => L.divIcon({ className: '', html: `<div class="pin ${cls}">${label}</div>`, iconSize: [34, 34], iconAnchor: [17, 46] });
const flagIcon = L.divIcon({ className: '', html: px(BM.flag, 3), iconSize: [27, 36], iconAnchor: [3, 36] });

let tmap, tLayer, meMarker, centered = false;
const panelH = () => ($('#panel') ? $('#panel').offsetHeight : 0) + 28;
function focusOn(ll, zoom, animate) {
  const z = zoom || tmap.getZoom(), p = tmap.project(ll, z); p.y += panelH() / 2 - 30;
  tmap.setView(tmap.unproject(p, z), z, { animate: !!animate });
}
function initTodayMap() {
  tmap = mkMap('map');
  tLayer = L.layerGroup().addTo(tmap);
  meMarker = L.marker([0, 0], { icon: charIcon(), interactive: false, zIndexOffset: 1000 });
  tmap.on('dragstart', () => { followMe = false; });
  $('#recenter').onclick = () => { followMe = true; if (pos) focusOn([pos.lat, pos.lng], Math.max(tmap.getZoom(), 16)); else fitToday(); };
}
function onPos() {
  if (!tmap) return;
  const first = !tmap.hasLayer(meMarker);
  if (first) meMarker.addTo(tmap);
  if (bmap && !bmap.hasLayer(bMe)) bMe.addTo(bmap);
  charTarget(pos, first);
  if (!centered && !today) { centered = true; focusOn([pos.lat, pos.lng], 16); }
  if (today && (today.status === 'active' || today.status === 'arrived')) updateDistLine();
}
function fitToday() {
  if (!today) return;
  const pts = [[today.start.lat, today.start.lng], [today.dest.lat, today.dest.lng], ...today.route];
  tmap.invalidateSize();
  tmap.fitBounds(L.latLngBounds(pts), { paddingTopLeft: [40, 90], paddingBottomRight: [40, panelH() + 50], maxZoom: 17 });
}
const trail = (layer, coords, weight, dash) => {
  L.polyline(coords, { color: '#ffc2d9', weight: weight + 8, opacity: 1, lineCap: 'butt', lineJoin: 'miter' }).addTo(layer);
  L.polyline(coords, { color: '#1b1630', weight, opacity: 1, dashArray: dash, lineCap: 'butt', lineJoin: 'miter' }).addTo(layer);
};
async function paintToday(fit) {
  tLayer.clearLayers();
  if (!today) return;
  trail(tLayer, today.route, 4, today.approx ? '4 12' : '8 8');
  L.marker([today.start.lat, today.start.lng], { icon: mkPin('blue', 'S') }).addTo(tLayer);
  L.marker([today.dest.lat, today.dest.lng], { icon: today.early ? mkPin('blue', 'E') : flagIcon }).addTo(tLayer);
  const media = (await dbAll('media')).filter(m => m.date === todayStr() && m.lat != null && !m.entryId);
  for (const m of media) L.marker([m.lat, m.lng], { icon: mkPin(m.type === 'photo' ? '' : 'voice', m.type === 'photo' ? 'P' : 'V'), interactive: false }).addTo(tLayer);
  if (fit) fitToday();
}

/* ---------- Today panel ---------- */
const captureRow = () => `
  <div class="capture">
    <button class="round" id="camBtn"><b>${ICON.cam}</b>Photo</button>
    <button class="round mic" id="micBtn"><b>${ICON.mic}</b>Voice note</button>
  </div>`;

function renderPanel() {
  const p = $('#panel');
  const rec = `<div id="recbar" class="${recState ? 'on' : ''}"><span class="dot"></span><span class="t" id="rect">${recState ? fmtDur(recState.secs) : '0:00'}</span><button id="recstop">STOP</button></div>`;
  if (!today && addrMode) {
    renderAddrPanel(p);
  } else if (!today) {
    const from = settings.startMode === 'address' && settings.address ? settings.address.label : 'My location';
    p.innerHTML = `
      <h1>Ready to wander?</h1>
      <div class="wlen"><button class="step" id="wMinus" aria-label="Shorter walk" ${busy ? 'disabled' : ''}>-</button><label class="wmin"><input id="wMin" type="number" inputmode="numeric" pattern="[0-9]*" min="${WALK_MIN.lo}" max="${WALK_MIN.hi}" value="${totalMin()}" aria-label="Walk time in minutes" ${busy ? 'disabled' : ''}><span>MIN</span></label><button class="step" id="wPlus" aria-label="Longer walk" ${busy ? 'disabled' : ''}>+</button></div>
      <p class="sub" id="wSub">${fmtMin(eachMin())} min out, ${fmtMin(eachMin())} min back.</p>
      <button class="go" id="goBtn" ${busy ? 'disabled' : ''}>${busy ? esc(busy) : 'GO!'}</button>
      ${busy ? '' : '<div class="start">PRESS GO</div><br>'}
      <button class="chip" id="fromChip">${ICON.pinS}<span>Start: ${esc(from)}</span></button>
      <div class="note" id="todayLine">${esc(todayLine)}</div>
      <div><button class="chip tiny" id="addrChip" ${busy ? 'disabled' : ''}>CHOOSE A DESTINATION</button></div>`;
    $('#goBtn').onclick = doGo;
    const setWalkMin = async (v, commit = true) => {
      v = clamp(Math.round(+v || 30), WALK_MIN.lo, WALK_MIN.hi); settings.walkMin = v;
      const i = $('#wMin'); if (i && commit) i.value = v;
      const sb = $('#wSub'); if (sb) sb.textContent = `${fmtMin(v / 2)} min out, ${fmtMin(v / 2)} min back.`;
      if (commit) await saveSettings();
    };
    $('#wMinus').onclick = () => setWalkMin(totalMin() - WALK_MIN.step);
    $('#wPlus').onclick = () => setWalkMin(totalMin() + WALK_MIN.step);
    const wi = $('#wMin');
    wi.onfocus = () => wi.select();
    wi.oninput = () => { const v = +wi.value; if (v >= WALK_MIN.lo && v <= WALK_MIN.hi) setWalkMin(v, false); };
    wi.onchange = () => setWalkMin(wi.value);
    wi.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); wi.blur(); } };
    $('#fromChip').onclick = () => showTab('profile');
    $('#addrChip').onclick = () => { addrMode = true; addrMsg = ''; renderPanel(); const i = $('#destIn'); if (i) i.focus(); };
  } else {
    const w = today, dist = fmtDist(w.distM);
    const approxNote = w.approx ? `<div class="note warn">Offline estimate. The path may not follow real streets.</div>` : '';
    if (w.status === 'planned') {
      const note = w.custom ? (w.distM > 3000 ? 'Longer than a usual walk, so leave yourself time.' : 'Follow the pink trail to the flag.') : (w.fromBank ? 'Picked from your prepared spots.' : 'Follow the pink trail to the flag.');
      p.innerHTML = `
        <h1>${w.custom ? 'Route ready!' : 'Quest found!'}</h1>
        ${w.custom ? `<div class="dest">${esc(w.label.split(',')[0])}</div>` : ''}
        <div class="big">${dist}<small>about ${Math.round(w.durMin)} min each way</small></div>
        <div class="note">${note}</div>
        ${approxNote}
        <div class="row"><button class="btn" id="startBtn" ${busy ? 'disabled' : ''}>${w.custom ? 'GO TO ADDRESS' : 'START WALK'}</button></div>
        ${w.custom ? '' : `<div class="row center"><button class="btn ghost small" id="rerollBtn" ${busy ? 'disabled' : ''}>${ICON.die} ${busy ? 'ROLLING' : 'RE-ROLL'}</button></div>`}
        <div class="row center"><button class="chip" id="cancelBtn" ${busy ? 'disabled' : ''}>CANCEL</button></div>`;
      $('#startBtn').onclick = startWalk;
      if (!w.custom) $('#rerollBtn').onclick = doGo;
      $('#cancelBtn').onclick = cancelWalk;
    } else if (w.status === 'active') {
      p.innerHTML = `
        ${rec}
        <h1>${w.custom ? 'On the way' : 'Walking out'}</h1>
        <div class="big" id="togo">…</div>
        ${stripHtml(false)}
        ${captureRow()}
        <div class="row center wide"><button class="btn" id="hereBtn">I’M HERE</button></div>
        <div class="row center"><button class="chip" id="endHereBtn">END HERE</button><button class="chip" id="cancelBtn">CANCEL WALK</button></div>`;
      $('#hereBtn').onclick = arrived;
      $('#endHereBtn').onclick = finishWalk;
      $('#cancelBtn').onclick = cancelWalk;
      updateDistLine();

}

      : `${dw.length} walks · ${fmtDist(dw.reduce((t, x) => t + walkedOf(x), 0))}`) : `${seq.length} item${seq.length === 1 ? '' : 's'}`;
    const card = document.createElement('div'); card.className = 'day box' + (hi === d ? ' sel' : '');

    dw.forEach((x, i) => {

async function paintMap() {
  if (!bmap) return;
  const my = ++bSeq;
  const [walks, media, entries] = await Promise.all([dbAll('walks'), dbAll('media'), dbAll('entries')]);
  if (my !== bSeq) return;
  bUrls.forEach(u => URL.revokeObjectURL(u)); bUrls = [];
  const f = mapFilter, walkDates = [...new Set(walks.map(w => w.date))].sort().reverse();
  if (f.mode === 'walk' && (!f.day || (!walkDates.includes(f.day) && walkDates.length && !media.some(m => m.date === f.day)))) f.day = walkDates[0] || null;
  if (f.mode === 'range') { f.from = f.from || f.to || todayStr(); f.to = f.to || f.from; }
  const lo = f.mode === 'range' ? (f.from <= f.to ? f.from : f.to) : null, hi = f.mode === 'range' ? (f.from <= f.to ? f.to : f.from) : null;
  const inView = d => f.mode === 'all' || (f.mode === 'walk' ? d === f.day : d >= lo && d <= hi);
  const ws = walks.filter(w => inView(w.date)), ms = media.filter(m => m.lat != null && !m.entryId && inView(m.date)), es = entries.filter(e => e.lat != null && inView(e.date));
  const byId = new Map(media.map(m => [m.id, m]));
  const url = b => { const u = URL.createObjectURL(b); bUrls.push(u); return u; };
  bLayer.clearLayers(); const pts = [];
  for (const w of ws) {
    trail(bLayer, w.route, f.mode === 'all' ? 3 : 4, '8 8');
    if (f.mode !== 'all') {
      L.marker([w.start.lat, w.start.lng], { icon: mkPin('blue', 'S'), interactive: false }).addTo(bLayer);
      L.marker([w.dest.lat, w.dest.lng], { icon: w.early ? mkPin('blue', 'E') : flagIcon, interactive: false }).addTo(bLayer);
    }
    pts.push(...w.route);
  }
  for (const m of ms) {
    const inner = m.type === 'photo' ? `<img src="${url(m.thumb || m.blob)}" alt="">` : px(BM.mic, 1.5);
    const mk = L.marker([m.lat, m.lng], { icon: L.divIcon({ className: '', html: `<div class="pin ${m.type === 'photo' ? 'photo' : 'voice'}">${inner}</div>`, iconSize: [34, 34], iconAnchor: [17, 46] }) });
    mk.on('click', () => openViewer(byId.get(m.id)));
    mk.addTo(bLayer); pts.push([m.lat, m.lng]);
  }
  for (const e of es) {
    const mk = L.marker([e.lat, e.lng], { icon: mkPin('', px(BM.book, 1.5)) });
    mk.on('click', () => openEntryForm(e).catch(fail('Entry')));
    mk.addTo(bLayer); pts.push([e.lat, e.lng]);
  }
  const np = ms.length + es.length;
  renderMapBar(walkDates, `${ws.length} walk${ws.length === 1 ? '' : 's'} · ${np} pin${np === 1 ? '' : 's'}`);
  setTimeout(() => {
    bmap.invalidateSize();
    if (pts.length) bmap.fitBounds(L.latLngBounds(pts), { paddingTopLeft: [40, $('#mapbar').offsetHeight + 50], paddingBottomRight: [40, 70], maxZoom: 17 });
    else if (pos) bmap.setView([pos.lat, pos.lng], 15);
  }, 60);
}

/* ---------- character: layered pixel sprite, recoloured per part ---------- */
const INK = '#1b1630';
const DEF_CHAR = { body: 'f', skin: '#f7c9a3', hairStyle: 1, hair: '#5a3b2a', top: 'tee', shirt: '#ffc2d9', outfit: 'pants', bottom: '#7fbcf5', shoes: '#ffffff', glasses: false, glassCol: '#8a5a2b', hat: 'none', hatCol: '#ff9dc0' };
const HAIR_STYLES = ['SHORT', 'LONG', 'TAIL', 'BUN', 'BOB', 'WAVY', 'BRAIDS', 'CURLY', 'TWIN BUNS', 'SPIKY'];
const TOPS = ['tee', 'long', 'tank', 'hoodie'], OUTFITS = ['pants', 'shorts', 'skirt', 'dress'], HATS = ['none', 'beanie', 'cap', 'bow'];
const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgbHex = (r, g, b) => '#' + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
const shade = (h, f) => { const [r, g, b] = hexRgb(h); return rgbHex(r * f, g * f, b * f); };
const SPR_W = 13, SPR_H = 21;
// frame 0-3 = walk cycle, -1 = standing. Faces right; the map mirrors it for left.
function spriteGrid(c, frame) {
  const g = Array.from({ length: SPR_H }, () => Array(SPR_W).fill(null));
  const P = (x, y, w, h, col) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (i >= 0 && i < SPR_W && j >= 0 && j < SPR_H) g[j][i] = col; };
  const walking = frame >= 0, bob = walking && frame % 2 ? -1 : 0, arm = walking ? [1, 0, -1, 0][frame] : 0;
  const male = c.body === 'm', dress = c.outfit === 'dress', skirt = c.outfit === 'skirt', shorts = c.outfit === 'shorts';
  const hs = c.hairStyle, top = c.top || 'tee', sleeved = top === 'long' || top === 'hoodie', tank = top === 'tank';
  const topCol = dress ? c.bottom : c.shirt;
  const dark = shade(c.hair, .72);
  // hair that sits behind the body
  if (hs === 1) P(3, 6 + bob, 2, 9, c.hair);
  if (hs === 2) { P(2, 5 + bob, 2, 2, c.hair); P(1, 7 + bob, 2, 3, c.hair); }
  if (hs === 4) P(3, 5 + bob, 2, 6, c.hair);
  if (hs === 5) { P(3, 6 + bob, 2, 3, c.hair); P(2, 9 + bob, 2, 3, c.hair); P(3, 12 + bob, 2, 3, c.hair); }
  if (hs === 6) { for (let k = 0; k < 9; k++) P(3, 7 + bob + k, 2, 1, k % 2 ? dark : c.hair); P(3, 16 + bob, 2, 1, c.shirt); }
  if (hs === 7) P(2, 4 + bob, 3, 6, c.hair);
  // far arm
  const slv = shade(c.shirt, .75), farSkin = shade(c.skin, .85);
  P(6 - arm, 10 + bob, 2, 2, tank ? farSkin : slv); P(6 - arm, 12 + bob, 2, 1, sleeved ? slv : farSkin); P(6 - arm, 13 + bob, 2, 1, farSkin);
  // legs
  const legs = walking ? [[{ c: 6, o: 2 }, { c: 6, o: -2 }], [{ c: 6, o: 0 }, { c: 7, o: 0 }], [{ c: 6, o: -2 }, { c: 6, o: 2 }], [{ c: 6, o: 0 }, { c: 5, o: 0 }]][frame] : [{ c: 5, o: 0 }, { c: 7, o: 0 }];
  const hip = 14 + bob;
  const legColAt = y => (c.outfit === 'pants' || (shorts && y <= 15)) ? c.bottom : c.skin;
  const leg = (L, f, shoe) => {
    for (let y = hip; y < 20; y++) {
      const x = L.c + (y >= 18 ? L.o : y >= 16 ? L.o / 2 : 0);
      if (y >= 18) { P(x, y, 2, 1, shoe); if (y === 19) P(x + 2, y, 1, 1, shoe); } else P(x, y, 2, 1, shade(legColAt(y), f));
    }
  };
  leg(legs[1], .8, shade(c.shoes, .82)); leg(legs[0], 1, c.shoes);
  // body (a broader build when male)
  const bx = male ? 4 : 5, bw = male ? 7 : 5;
  P(bx, 10 + bob, bw, 4, topCol);
  if (top === 'hoodie' && !dress) { P(4, 9 + bob, 3, 2, shade(c.shirt, .85)); P(bx + 2, 12 + bob, 3, 1, shade(c.shirt, .85)); }
  if (tank && !dress) { P(bx, 10 + bob, bw, 1, c.skin); P(bx + 1, 10 + bob, 1, 1, c.shirt); P(bx + bw - 2, 10 + bob, 1, 1, c.shirt); }
  if (skirt || dress) { P(4, 13 + bob, 7, 1, c.bottom); P(3, 14 + bob, 9, 2, c.bottom); }
  // near arm
  const nslv = shade(c.shirt, .92);

async function setAddress() {
  const q = $('#addr').value.trim(); if (!q) return;
  if (!navigator.onLine) { toast('Needs internet to look up a new address.'); return; }
  $('#addrGo').disabled = true;
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q));
    const j = await r.json();
    if (!j.length) { toast('Couldn’t find that address. Try adding the city.', 4000); return; }
    settings.address = { query: q, lat: +j[0].lat, lng: +j[0].lon, label: j[0].display_name.split(',').slice(0, 3).join(',') };
    settings.startMode = 'address'; await saveSettings(); toast('Starting from that address.'); renderProfile();
  } catch { toast('Address lookup failed. Check your connection.', 4000); }
  finally { const b = $('#addrGo'); if (b) b.disabled = false; }
}
function setProg(text, frac) {
  const p = $('#prog'); if (p) p.textContent = text;
  const bar = $('#bar'); if (bar) { bar.classList.toggle('on', frac != null); if (frac != null) $('i', bar).style.width = Math.round(frac * 100) + '%'; }
}
const tileXY = (lat, lng, z) => { const n = 2 ** z; return [Math.floor((lng + 180) / 360 * n), Math.floor((1 - Math.log(Math.tan(rad(lat)) + 1 / Math.cos(rad(lat))) / Math.PI) / 2 * n)]; };
function tilesAround(c, rKm, zs) {
  const out = [];
  for (const z of zs) {
    const dLat = rKm / 111.32, dLng = rKm / (111.32 * Math.cos(rad(c.lat)));
    const [x0, y1] = tileXY(c.lat - dLat, c.lng - dLng, z), [x1, y0] = tileXY(c.lat + dLat, c.lng + dLng, z);
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) out.push(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`);
  }
  return out;
}
let saving = false;
async function saveArea() {
  if (saving) return;
  if (!navigator.onLine) { toast('Connect to Wi-Fi first.'); return; }
  saving = true; $('#saveArea').disabled = true;
  try {
    const c = await getStart(); const urls = tilesAround(c, 3, [13, 14, 15, 16, 17]);
    const cache = await caches.open('wander-tiles'); let done = 0, fail = 0, i = 0;
    const worker = async () => {
      while (i < urls.length) {
        const u = urls[i++];
        try { if (!(await cache.match(u))) { const r = await fetch(u, { mode: 'cors', credentials: 'omit' }); if (r.ok) await cache.put(u, r); else fail++; } }
        catch { fail++; }
        done++; if (done % 10 === 0) setProg(`Saving map… ${done} / ${urls.length}`, done / urls.length);
      }
    };
    await Promise.all([worker(), worker(), worker(), worker()]);
    setProg(fail > urls.length * .1 ? `Saved most of the map (${fail} tiles failed). Try again on better Wi-Fi.` : 'Map area saved.', null);
    toast(fail > urls.length * .1 ? 'Some tiles failed. Try again.' : 'Map saved for offline use.');
  } catch (e) { toast(e.message || 'Couldn’t save the map.', 4000); }
  finally { saving = false; renderProfile(); }
}
let prepping = false;
async function prepBank() {
  if (prepping) return;
  if (!navigator.onLine) { toast('Connect to Wi-Fi first.'); return; }
  prepping = true; $('#prepBank').disabled = true;
  try {
    const start = await getStart();
    const have = (await dbAll('bank')).filter(b => hav(b.start, start) < 600 && Math.abs((b.pace || settings.pace) - settings.pace) <= 1 && (b.walkMin || 30) === totalMin()).length;
    const need = Math.max(0, 14 - have); let made = 0;
    for (let k = 0; k < need; k++) {
      setProg(`Preparing spots… ${made} / ${need}`, made / need);
      try {
        const r = await genLive(start, { bearing: (k * 360 / need + Math.random() * 20) % 360, tries: 2 });
        await dbPut('bank', { start, dest: r.dest, route: r.route, distM: r.distM, pace: settings.pace, walkMin: totalMin(), created: Date.now() }); made++;
      } catch (e) { console.warn(e); }
      await sleep(400);
    }
    toast(made ? `${made} spot${made === 1 ? '' : 's'} ready for offline.` : need ? 'Couldn’t reach the route service. Try again.' : 'You already have two weeks ready.');
  } catch (e) { toast(e.message || 'Couldn’t prepare spots.', 4000); }
  finally { prepping = false; renderProfile(); }
}

/* ---------- backup ---------- */
const b2d = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const d2b = d => fetch(d).then(r => r.blob());
async function exportAll() {
  try {
    const [walks, media, entries] = await Promise.all([dbAll('walks'), dbAll('media'), dbAll('entries')]);
    const parts = ['{"v":2,"settings":', JSON.stringify(settings), ',"walks":', JSON.stringify(walks), ',"entries":', JSON.stringify(entries), ',"media":['];
    for (let i = 0; i < media.length; i++) {
      const m = media[i];
      parts.push((i ? ',' : '') + JSON.stringify({ ...m, blob: await b2d(m.blob), thumb: m.thumb ? await b2d(m.thumb) : null }));
    }
    parts.push(']}');
    const file = new File(parts, `wander-backup-${todayStr()}.json`, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Wander backup' }); return; } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast('Backup saved.');
  } catch (e) { console.error(e); toast('Couldn’t create the backup.', 4000); }
}
async function importAll(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); if (!j || !j.media || !j.walks) throw new Error('bad file');
    for (const w of j.walks) await dbPut('walks', w);
    if (j.settings && j.settings.character) { settings.character = { ...DEF_CHAR, ...j.settings.character }; if (j.settings.name) settings.name = j.settings.name; await saveSettings(); refreshCharMarkers(); }
    for (const en of (j.entries || [])) await dbPut('entries', en);
    for (const m of j.media) await dbPut('media', { ...m, blob: await d2b(m.blob), thumb: m.thumb ? await d2b(m.thumb) : null });
    await loadToday(); renderPanel(); refreshViews(); paintHud();
    toast(`Imported ${j.walks.length} walks, ${(j.entries || []).length} entries and ${j.media.length} photos/notes.`);
  } catch { toast('That doesn’t look like a Wander backup.', 4000); }
}

/* ---------- tabs ---------- */
function showTab(t) {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + t));
  try {
    if (t === 'today') { setTimeout(() => { tmap.invalidateSize(); if (today) fitToday(); }, 50); paintHud(); }
    if (t === 'journal') renderJournal().catch(fail('Journal'));
    if (t === 'map') { if (!bmap) initBigMap(); paintMap().catch(fail('Map')); }
    if (t === 'profile') renderProfile().catch(fail('Profile'));
  } catch (e) { fail(t)(e); }
}
const fail = name => e => { console.error(e); toast(name + ' error: ' + (e && e.message ? e.message : e), 7000); };

/* ---------- boot ---------- */
async function boot() {
  await openDB();
  const s = await dbGet('kv', 'settings'); settings = { ...defaults, ...(s || {}) };
  settings.character = { ...DEF_CHAR, ...(settings.character || {}) };
  await loadToday();
  $('#t-today').innerHTML = ICON.pin + 'Today';
  $('#t-journal').innerHTML = ICON.book + 'Journal';
  $('#t-cam').innerHTML = `<b>${ICON.cam}</b>`;
  $('#t-map').innerHTML = ICON.map + 'Map';
  $('#t-profile').innerHTML = ICON.person + 'Profile';
  $('#recenter').innerHTML = ICON.cross; $('#recenter2').innerHTML = ICON.cross;
  document.querySelectorAll('#tabs button[data-tab]').forEach(b => b.onclick = () => showTab(b.dataset.tab));
  $('#t-cam').onclick = openCamera;
  $('#t-mic').innerHTML = px(BM.mic, 2);
  $('#t-mic').onclick = async () => { const was = !!recState; await toggleRec(); if (!was && recState) toast('Recording… tap the mic again to stop.', 3000); };
  $('#entryPhoto').onchange = onEntryPhotos;
  initTodayMap();
  $('#camInput').onchange = onPhoto; $('#importInput').onchange = importAll;
  $('#vclose').onclick = closeViewer; $('#vdel').onclick = delViewing;
  $('#vcap').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };
  const setOnline = () => $('#offline').classList.toggle('on', !navigator.onLine);
  addEventListener('online', setOnline); addEventListener('offline', setOnline); setOnline();
  renderPanel(); paintHud(); await paintToday(true);
  startWatch(); setInterval(setWalkerState, 2000);
  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) return;
    startWatch();
    const t = pickCurrent(await dbAll('walks'));
    if (today && today.status === 'done' && !t) return;
    if ((t && t.id) !== (today && today.id)) { today = t || null; renderPanel(); paintToday(true); paintHud(); }
  });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.__wander = { get today() { return today; } };   // handy for debugging
}
boot().catch(e => { console.error(e); document.body.innerHTML = '<p style="padding:24px;font-family:sans-serif">Wander couldn’t start: ' + esc(e.message) + '</p>'; });
})();
